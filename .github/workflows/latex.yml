name: Build LaTeX PDF

on:
  push:
    paths:
      - 'Notebook-ICPC/**'
  pull_request:
    paths:
      - 'Notebook-ICPC/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Notebook-ICPC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: Notebook-ICPC
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Notebook-ICPC-PDF
          path: Notebook-ICPC/main.pdf
